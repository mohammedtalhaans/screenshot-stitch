name: Verify and deploy Screenshot Stitch
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: screenshot-stitch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Require a committed dependency lockfile
        run: |
          if [ ! -f package-lock.json ]; then
            echo '::error::Run npm install locally and commit package-lock.json before releasing.'
            exit 1
          fi
      - run: npm ci
      - name: Audit runtime dependencies
        run: npm run audit:runtime
      - run: npm run typecheck
      - run: npm test
      - name: Build static site with local OCR assets
        run: npm run build
        env:
          VITE_SOURCE_URL: https://github.com/${{ github.repository }}
      - run: npx playwright install --with-deps chromium webkit
      - name: Browser, OCR, privacy and project-path checks
        run: npm run test:e2e
      - name: Retain test reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-validation
          path: |
            playwright-report/
            test-results/
            .offline-check/*-results.json
          retention-days: 7
      - name: Upload tested static site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy the verified artifact
        id: deployment
        uses: actions/deploy-pages@v4
